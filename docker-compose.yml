services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-backend_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - typerek-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backend}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rails:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      BACKEND_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_HOST: postgres
      SOLID_QUEUE_IN_PUMA: "true"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-3}
      RAILS_ASSUME_SSL: ${RAILS_ASSUME_SSL:-false}
      RAILS_LOG_LEVEL: ${RAILS_LOG_LEVEL:-info}
      ALLOWED_HOST: ${ALLOWED_HOST:-}
    networks:
      - typerek-net

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      - rails
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./certs:/etc/nginx/ssl:ro
    networks:
      - typerek-net

volumes:
  postgres_data:

networks:
  typerek-net:
