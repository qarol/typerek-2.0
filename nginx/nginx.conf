worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    upstream rails {
        server rails:80;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # API proxy to Rails (via Thruster on port 80)
        location /api {
            proxy_pass http://rails;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check passthrough
        location /up {
            proxy_pass http://rails;
        }

        # Static assets with long cache (Vite hashed filenames)
        location /assets {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # SPA fallback for Vue Router history mode
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # Optional HTTPS server — activated when cert files are mounted at /etc/nginx/ssl/
    # Mount certs via: ./certs:/etc/nginx/ssl:ro in docker-compose
    # Files expected: /etc/nginx/ssl/fullchain.pem and /etc/nginx/ssl/privkey.pem
    include /etc/nginx/conf.d/*.conf;
}
